name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install OpenSSH server (integration tests start their own sshd)
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      # Failed tests show up as annotations on the run (readable without opening the logs).
      - run: dotnet test --configuration Release --logger GitHubActions --logger "console;verbosity=normal"

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   channel: win,       exe: BoltShell.exe, icon: app.ico }
          - { os: ubuntu-latest,  rid: linux-x64, channel: linux,     exe: BoltShell,     icon: icon-256.png }
          - { os: macos-latest,   rid: osx-arm64, channel: osx-arm64, exe: BoltShell,     icon: app.icns }
          - { os: macos-latest,   rid: osx-x64,   channel: osx-x64,   exe: BoltShell,     icon: app.icns }
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing + notarization run only when the Apple secrets are configured (and not for pull requests).
      MACOS_SIGN: ${{ startsWith(matrix.os, 'macos') && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATES_P12 != '' }}
      # Windows signing (Azure Artifact Signing) only for release tags: every signed file counts against the quota.
      WINDOWS_SIGN: ${{ startsWith(matrix.os, 'windows') && startsWith(github.ref, 'refs/tags/v') && secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/BoltShell.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Check license files in the distribution
        shell: bash
        run: |
          test -f publish/LICENSE && test -f publish/THIRD_PARTY_NOTICES.md
          for f in licenses/*.txt; do test -f "publish/$f" || { echo "::error::missing $f in publish output"; exit 1; }; done
          echo "$(ls publish/licenses | wc -l) license files included"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Install AppImage tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Download previous release (delta updates)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: bash
        run: >
          vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}" --channel ${{ matrix.channel }} --outputDir releases

      # Developer ID certificates (application + installer, one .p12) go into a temporary keychain; notarization uses
      # an App Store Connect API key stored there as notarytool profile "boltshell".
      - name: Prepare macOS signing
        if: env.MACOS_SIGN == 'true'
        shell: bash
        env:
          CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/boltshell-signing.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/certificates.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          app_identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          installer_identity="$(security find-identity -v "$keychain" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')"
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            echo "::error::The .p12 must contain both a 'Developer ID Application' and a 'Developer ID Installer' certificate with private keys."
            exit 1
          fi
          echo "Signing as: $app_identity / $installer_identity"

          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials boltshell --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

          {
            echo "MACOS_KEYCHAIN=$keychain"
            echo "MACOS_APP_IDENTITY=$app_identity"
            echo "MACOS_INSTALLER_IDENTITY=$installer_identity"
          } >> "$GITHUB_ENV"

      # Azure Artifact Signing: account and certificate profile come from repository variables; the app registration
      # that may sign (role "Artifact Signing Certificate Profile Signer") authenticates via AZURE_* secrets.
      - name: Prepare Windows signing
        if: env.WINDOWS_SIGN == 'true'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$ACCOUNT" ] || [ -z "$PROFILE" ]; then
            echo "::error::Set the repository variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_PROFILE."
            exit 1
          fi
          file="$RUNNER_TEMP/artifact-signing.json"
          printf '{ "Endpoint": "%s", "CodeSigningAccountName": "%s", "CertificateProfileName": "%s" }\n' \
            "$ENDPOINT" "$ACCOUNT" "$PROFILE" > "$file"
          echo "WINDOWS_SIGN_FILE=$file" >> "$GITHUB_ENV"

      # Release notes travel inside the package; vpk upload uses them as the GitHub release text.
      - name: Package
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ env.WINDOWS_SIGN == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.WINDOWS_SIGN == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.WINDOWS_SIGN == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          version="${{ steps.version.outputs.version }}"
          printf '%s\n' "Source code for this release: tag v$version (archives below)." \
            "License texts are included in every package (LICENSE, THIRD_PARTY_NOTICES.md, licenses/)." > release-notes.md
          sign=()
          if [ "$WINDOWS_SIGN" = "true" ]; then
            sign=(--azureTrustedSignFile "$WINDOWS_SIGN_FILE")
          fi
          if [ "$MACOS_SIGN" = "true" ]; then
            sign=(--signAppIdentity "$MACOS_APP_IDENTITY" --signInstallIdentity "$MACOS_INSTALLER_IDENTITY"
                  --signEntitlements build/macos/entitlements.plist --notaryProfile boltshell --keychain "$MACOS_KEYCHAIN")
          fi
          vpk pack --packId BoltShell --packVersion "$version" \
            --runtime ${{ matrix.rid }} --packDir publish --mainExe ${{ matrix.exe }} --packTitle "BoltShell" --packAuthors "BoltShell contributors" \
            --icon src/BoltShell.App/Assets/icon/${{ matrix.icon }} --channel ${{ matrix.channel }} --outputDir releases \
            --releaseNotes release-notes.md "${sign[@]}"

      - name: Verify Windows signatures
        if: env.WINDOWS_SIGN == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem releases -Filter '*Setup.exe' | Select-Object -First 1
          $portable = Get-ChildItem releases -Filter '*Portable.zip' | Select-Object -First 1
          Expand-Archive $portable.FullName -DestinationPath "$env:RUNNER_TEMP/portable"
          $app = Get-ChildItem "$env:RUNNER_TEMP/portable" -Recurse -Filter 'BoltShell.exe' | Select-Object -First 1
          foreach ($file in @($setup, $app)) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($signature.Status) – $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$($file.Name) is not validly signed." }
          }

      - name: Verify macOS signature and notarization
        if: env.MACOS_SIGN == 'true'
        shell: bash
        run: |
          pkg="$(ls releases/*.pkg | head -1)"
          pkgutil --check-signature "$pkg"
          spctl --assess --type install --verbose=2 "$pkg"
          xcrun stapler validate "$pkg" || echo "::warning::The notarization ticket is not stapled to $pkg (Gatekeeper then checks online)."

      - name: Remove signing keychain
        if: always() && env.MACOS_SIGN == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/boltshell-signing.keychain-db" || true

      - uses: actions/upload-artifact@v6
        with:
          name: BoltShell-${{ matrix.rid }}
          path: releases/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      # One release for all platforms; uploaded sequentially to avoid races. It is also the auto-update feed.
      - name: Publish GitHub release
        shell: bash
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          for channel in win linux osx-arm64 osx-x64; do
            case "$channel" in
              win) dir=artifacts/BoltShell-win-x64 ;;
              linux) dir=artifacts/BoltShell-linux-x64 ;;
              *) dir="artifacts/BoltShell-$channel" ;;
            esac
            vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" \
              --token "${{ secrets.GITHUB_TOKEN }}" --channel "$channel" --outputDir "$dir" \
              --tag "v$version" --releaseName "BoltShell $version" --merge --publish
          done
